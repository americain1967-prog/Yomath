<!DOCTYPE html>
<html>
<head>
    <title>Plateforme éducative</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            animation: fadeIn 1s ease-in-out;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .card {
            background: white;
            color: black;
            width: 250px;
            margin: 15px;
            padding: 20px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
            background: #f1f1f1;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<h1>📚 Plateforme éducative</h1>

<div class="container">
    <a href="cours.html" class="card">📖 Cours</a>
    <a href="devoirs.html" class="card">✏️ Devoirs</a>
    <a href="quiz.html" class="card">🧠 Quiz</a>
    <a href="corrections.html" class="card">✅ Corrections</a>
</div>

</body>
</html>
