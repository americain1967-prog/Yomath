<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduApp</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

.header{
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.langs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:15px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
    text-decoration:none;
    color:white;
}
</style>
</head>

<body>

<div class="header" id="title">📚 EduApp</div>

<div class="langs">
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('dioula')">DI</button>
<button onclick="setLang('moore')">MO</button>
</div>

<div class="grid">
<a href="quiz.html" class="card">🧠 Quiz</a>
<a href="classement.html" class="card">🏆 Ranking</a>
<a href="#" class="card">📖 Cours</a>
<a href="#" class="card">⚙ Settings</a>
</div>

<script>

const t={
fr:{title:"📚 EduApp"},
en:{title:"📚 EduApp"},
es:{title:"📚 EduApp"},
dioula:{title:"📚 Kalan App"},
moore:{title:"📚 Koom App"}
};

function setLang(l){
    localStorage.setItem("lang",l);
    apply();
}

function apply(){
    let l=localStorage.getItem("lang")||"fr";
    document.getElementById("title").innerText=t[l]?.title||t.fr.title;
}

apply();

</script>

</body>
</html>
