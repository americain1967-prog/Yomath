<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduGlobal</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.header{
    padding:20px;
    font-size:24px;
    font-weight:bold;
    text-align:center;
}

.langs{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:10px;
}

button{
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:15px;
}

.card{
    background:#1f2937;
    padding:20px;
    border-radius:12px;
    text-align:center;
    text-decoration:none;
    color:white;
}
</style>
</head>

<body>

<div class="header" id="title">🌍 EduGlobal</div>

<div class="langs">
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('dioula')">DI</button>
<button onclick="setLang('moore')">MO</button>
</div>

<div class="grid">
<a class="card" href="quiz.html">🧠 Quiz</a>
<a class="card" href="ranking.html">🏆 Ranking</a>
<a class="card" href="#">📚 Courses</a>
<a class="card" href="#">⚙ Settings</a>
</div>

<script>

const t={
fr:{title:"🌍 EduGlobal"},
en:{title:"🌍 EduGlobal"},
es:{title:"🌍 EduGlobal"},
dioula:{title:"🌍 Kalan Platform"},
moore:{title:"🌍 Koom Platform"}
};

function setLang(l){
    localStorage.setItem("lang",l);
    apply();
}

function apply(){
    let l=localStorage.getItem("lang")||"fr";
    document.getElementById("title").innerText=t[l]?.title||t.fr.title;
}

apply();

</script>

</body>
</html>
