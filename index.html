<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Platform Pro</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

select,input,button{
width:80%;
padding:10px;
margin:5px;
border-radius:10px;
border:none;
}

button{
background:#2563eb;
color:white;
}
.card{
background:#111827;
margin:10px;
padding:10px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>🎓 Edu Platform Pro</h1>

<input id="name" placeholder="Nom élève">

<select id="classe">
<option>6e</option><option>5e</option><option>4e</option><option>3e</option>
<option>2nde</option><option>1ère C</option><option>1ère D</option>
<option>Terminale C</option><option>Terminale D</option>
</select>

<select id="matiere" onchange="loadChapters()">
<option value="math">Maths</option>
<option value="pc">Physique-Chimie</option>
<option value="svt">SVT</option>
</select>

<select id="chapitre"></select>

<hr>

<div class="card">

<h3>📚 Modules</h3>

<button onclick="go('cours.html')">📖 Cours</button>
<button onclick="go('quiz.html')">🎮 Quiz IA</button>
<button onclick="go('devoir.html')">📝 Devoirs Bac</button>
<button onclick="go('correction.html')">✅ Correction</button>

</div>

<div class="card">

<h3>⚔️ Social</h3>

<button onclick="go('chat.html')">💬 Chat chapitre</button>
<button onclick="go('duel.html')">⚔️ Duel (code match)</button>
<button onclick="go('classement.html')">🏆 Classement</button>
<button onclick="go('badges.html')">🎖️ Badges</button>

</div>

<p id="info"></p>

<script>

function save(){
localStorage.setItem("player",document.getElementById("name").value||"Anonyme");
localStorage.setItem("classe",document.getElementById("classe").value);
localStorage.setItem("matiere",document.getElementById("matiere").value);
localStorage.setItem("chapitre",document.getElementById("chapitre").value);
}

function go(page){
save();
window.location.href=page;
}

function loadChapters(){

let m=document.getElementById("matiere").value;
let c=document.getElementById("chapitre");

let data={
math:["Nombres","Equations","Fonctions"],
pc:["Electricité","Energie","Température"],
svt:["Cellule","Organes","Respiration"]
};

c.innerHTML="";

data[m].forEach(x=>{
let o=document.createElement("option");
o.value=x;
o.innerText=x;
c.appendChild(o);
});

}

loadChapters();

</script>

</body>
</html>
