<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateforme Scolaire</title>
</head>

<body style="font-family:Arial;text-align:center;background:#0f172a;color:white">

<h1>🎓 Plateforme Scolaire</h1>

<input id="name" placeholder="Ton nom"><br><br>

<select id="classe">
<option value="6e">6e</option>
<option value="5e">5e</option>
<option value="4e">4e</option>
</select><br><br>

<select id="matiere">
<option value="math">Maths</option>
<option value="pc">Physique-Chimie</option>
<option value="svt">SVT</option>
</select><br><br>

<h3>Choisir une activité</h3>

<button onclick="go('cours.html')">📖 Cours</button>
<button onclick="go('devoir.html')">📝 Devoir</button>
<button onclick="go('quiz.html')">🎮 Quiz</button>

<script>

function save(){
localStorage.setItem("player", document.getElementById("name").value || "Anonyme");
localStorage.setItem("classe", document.getElementById("classe").value);
localStorage.setItem("matiere", document.getElementById("matiere").value);
}

function go(page){
save();
window.location.href = page;
}

</script>

</body>
</html>
