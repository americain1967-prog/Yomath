<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Platform</title>
</head>

<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h1>🎓 Edu Platform</h1>

<input id="name" placeholder="Nom"><br><br>

<select id="classe">
<option>6e</option>
<option>5e</option>
<option>4e</option>
<option>3e</option>
<option>2nde</option>
<option>1ère C</option>
<option>1ère D</option>
<option>Terminale C</option>
<option>Terminale D</option>
</select><br><br>

<select id="matiere" onchange="loadChapters()">
<option value="math">Maths</option>
<option value="pc">Physique-Chimie</option>
<option value="svt">SVT</option>
</select><br><br>

<select id="chapitre">
<option value="">Choisir chapitre</option>
</select><br><br>

<button onclick="start()">🚀 Accéder au chapitre</button>

<p id="info"></p>

<script>

function loadChapters(){

let m = document.getElementById("matiere").value;
let chap = document.getElementById("chapitre");

chap.innerHTML = "";

let data = {
math:["Addition","Equations","Fonctions"],
pc:["Électricité","Température","Énergie"],
svt:["Cellule","Respiration","Organes"]
};

data[m].forEach(c=>{
let opt = document.createElement("option");
opt.value = c;
opt.innerText = c;
chap.appendChild(opt);
});

}

function start(){

let name = document.getElementById("name").value || "Anonyme";
let classe = document.getElementById("classe").value;
let matiere = document.getElementById("matiere").value;
let chapitre = document.getElementById("chapitre").value;

if(!chapitre){
alert("Choisis un chapitre");
return;
}

localStorage.setItem("player", name);
localStorage.setItem("classe", classe);
localStorage.setItem("matiere", matiere);
localStorage.setItem("chapitre", chapitre);

document.getElementById("info").innerText =
"Chapitre sélectionné : " + chapitre;

}

loadChapters();

</script>

</body>
</html>
