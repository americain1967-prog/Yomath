<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateforme</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    text-align:center;
}
button{margin:5px;padding:8px}
.card{
    display:block;
    margin:10px;
    padding:15px;
    background:white;
    color:black;
    border-radius:10px;
    text-decoration:none;
}
</style>
</head>

<body>

<h1 id="title">📚 Plateforme</h1>

<!-- LANGUES -->
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
<button onclick="setLang('dioula')">DI</button>
<button onclick="setLang('moore')">MO</button>

<a class="card" href="quiz.html">🧠 Quiz</a>

<script>

function setLang(l){
    localStorage.setItem("lang",l);
    applyLang();
}

const t={
fr:{title:"📚 Plateforme"},
en:{title:"📚 Platform"},
es:{title:"📚 Plataforma"},
dioula:{title:"📚 Kalan"},
moore:{title:"📚 Koom"}
};

function applyLang(){
    let l=localStorage.getItem("lang")||"fr";
    document.getElementById("title").innerText=t[l]?.title||t.fr.title;
}

applyLang();

</script>

</body>
</html>
