<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Startup</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}
button{
    padding:12px;
    width:80%;
    margin:10px;
    border-radius:10px;
}
input{
    padding:10px;
    width:80%;
}
</style>
</head>

<body>

<h1>🌍 Quiz Startup</h1>

<input id="name" placeholder="Entre ton pseudo"><br>

<button onclick="start()">Commencer</button>

<h3>🏆 Classement</h3>
<div id="ranking"></div>

<script>

function start(){
let name = document.getElementById("name").value || "Anonyme";
localStorage.setItem("player", name);
window.location.href = "quiz.html";
}

function showRanking(){
let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

let html = "";

ranking.forEach((p,i)=>{
html += `<p>🏆 ${i+1}. ${p.name} - ${p.score} (Niv ${p.level})</p>`;
});

document.getElementById("ranking").innerHTML = html || "Aucun score";
}

showRanking();

</script>

</body>
</html>
