<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateforme éducative</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 30px;
}

.container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* 📱 Responsive */
@media(min-width:600px){
    .container {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<h1>📚 Plateforme éducative</h1>

<div class="container">
    <a href="cours.html" class="card">📖 Cours</a>
    <a href="devoirs.html" class="card">✏️ Devoirs</a>
    <a href="quiz.html" class="card">🧠 Quiz</a>
    <a href="corrections.html" class="card">✅ Corrections</a>
</div>

</body>
</html>
