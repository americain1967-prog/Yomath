<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateforme éducative</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
}

.lang {
    position: absolute;
    top: 10px;
    right: 10px;
}

button {
    margin: 3px;
    padding: 6px;
    border-radius: 8px;
    border: none;
}

.container {
    display: grid;
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="lang">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('es')">ES</button>
    <button onclick="setLang('pt')">PT</button>
    <button onclick="setLang('moore')">MO</button>
    <button onclick="setLang('dioula')">DI</button>
</div>

<h1 data-key="title">📚 Plateforme éducative</h1>

<div class="container">
    <a href="cours.html" class="card" data-key="cours">📖 Cours</a>
    <a href="devoirs.html" class="card" data-key="devoirs">✏️ Devoirs</a>
    <a href="quiz.html" class="card" data-key="quiz">🧠 Quiz</a>
    <a href="corrections.html" class="card" data-key="corrections">✅ Corrections</a>
</div>

<script>
const translations = {
    fr: {
        title: "📚 Plateforme éducative",
        cours: "📖 Cours",
        devoirs: "✏️ Devoirs",
        quiz: "🧠 Quiz",
        corrections: "✅ Corrections"
    },
    en: {
        title: "📚 Educational Platform",
        cours: "📖 Courses",
        devoirs: "✏️ Homework",
        quiz: "🧠 Quiz",
        corrections: "✅ Corrections"
    },
    es: {
        title: "📚 Plataforma educativa",
        cours: "📖 Cursos",
        devoirs: "✏️ Tareas",
        quiz: "🧠 Quiz",
        corrections: "✅ Correcciones"
    },
    pt: {
        title: "📚 Plataforma educacional",
        cours: "📖 Cursos",
        devoirs: "✏️ Tarefas",
        quiz: "🧠 Quiz",
        corrections: "✅ Correções"
    },
    moore: {
        title: "📚 Zãabre yelemdé",
        cours: "📖 Zãabre",
        devoirs: "✏️ Kibaré",
        quiz: "🧠 Quiz",
        corrections: "✅ Barka"
    },
    dioula: {
        title: "📚 Plateforme école",
        cours: "📖 Cours",
        devoirs: "✏️ Devoirs",
        quiz: "🧠 Quiz",
        corrections: "✅ Corrections"
    }
};

function setLang(lang){
    localStorage.setItem("lang", lang);

    document.querySelectorAll("[data-key]").forEach(el => {
        const key = el.getAttribute("data-key");
        el.innerText = translations[lang][key];
    });
}

window.onload = function(){
    let lang = localStorage.getItem("lang") || "fr";
    setLang(lang);
}
</script>

</body>
</html>
