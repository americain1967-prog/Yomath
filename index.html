<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School AI Platform</title>
</head>

<body style="font-family:Arial;text-align:center;background:#0f172a;color:white">

<h1>🎓 School AI Platform</h1>

<input id="name" placeholder="Nom"><br><br>

<select id="classe">
<option>6e</option><option>5e</option><option>4e</option><option>3e</option>
<option>2nde</option><option>1ère C</option><option>1ère D</option>
<option>Terminale C</option><option>Terminale D</option>
</select><br><br>

<select id="matiere">
<option value="math">Maths</option>
<option value="pc">Physique-Chimie</option>
<option value="svt">SVT</option>
</select><br><br>

<h3>📚 Menu</h3>

<button onclick="go('cours.html')">📖 Cours</button>
<button onclick="go('devoir.html')">📝 Devoirs</button>
<button onclick="go('quiz.html')">🎮 Quiz</button>
<button onclick="go('classement.html')">🏆 Classement</button>
<button onclick="go('duel.html')">⚔️ Duel</button>
<button onclick="go('badges.html')">🎖️ Badges</button>

<script>

function save(){
localStorage.setItem("player", document.getElementById("name").value || "Anonyme");
localStorage.setItem("classe", document.getElementById("classe").value);
localStorage.setItem("matiere", document.getElementById("matiere").value);
}

function go(page){
save();
window.location.href = page;
}

</script>

</body>
</html>
