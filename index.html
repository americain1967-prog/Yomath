<!DOCTYPE html>
<html>
<head>
<title>Quiz Startup</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center}
button{width:80%;padding:10px;margin:5px}
input{width:80%;padding:10px;margin:5px}
</style>
</head>

<body>

<h2>🌍 Quiz Startup</h2>

<input id="name" placeholder="Pseudo">
<button onclick="start()">OK</button>

<div id="score">Score: 0</div>
<p id="q"></p>
<div id="a"></div>

<script>

// 🧠 QUIZ
const Q=[
{q:"2+2",a:["3","4"],c:1},
{q:"BF capitale",a:["Ouaga","Paris"],c:0}
];

let i=0;
let score=0;
let player="";

function start(){
player=document.getElementById("name").value;
load();
}

function load(){
document.getElementById("q").innerText=Q[i].q;

let html="";
Q[i].a.forEach((x,n)=>{
html+=`<button onclick="check(${n})">${x}</button>`;
});

document.getElementById("a").innerHTML=html;
document.getElementById("score").innerText="Score: "+score;
}

function check(n){
if(n===Q[i].c) score++;
i++;

if(i>=Q.length){
end();
return;
}

load();
}

function end(){
document.getElementById("q").innerText="FIN 🎉";
document.getElementById("a").innerHTML="";
document.getElementById("score").innerText="Score: "+score;
}

load();

</script>

</body>
</html>
