<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateforme éducative</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    text-align: center;
}

.lang {
    position: absolute;
    top: 10px;
    right: 10px;
}

button {
    margin: 3px;
    padding: 6px;
    border-radius: 8px;
    border: none;
}

.container {
    display: grid;
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="lang">
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('en')">EN</button>
</div>

<h1 id="title">📚 Plateforme éducative</h1>

<div class="container">
    <a href="cours.html" class="card" id="cours">📖 Cours</a>
    <a href="devoirs.html" class="card" id="devoirs">✏️ Devoirs</a>
    <a href="quiz.html" class="card" id="quiz">🧠 Quiz</a>
    <a href="corrections.html" class="card" id="corrections">✅ Corrections</a>
</div>

<script>

// 🔥 LANGUE UNIQUE
function setLang(lang){
    localStorage.setItem("lang", lang);
    applyLang();
}

// 🔥 TRADUCTIONS
const langData = {
    fr: {
        title: "📚 Plateforme éducative",
        cours: "📖 Cours",
        devoirs: "✏️ Devoirs",
        quiz: "🧠 Quiz",
        corrections: "✅ Corrections"
    },
    en: {
        title: "📚 Educational Platform",
        cours: "📖 Courses",
        devoirs: "✏️ Homework",
        quiz: "🧠 Quiz",
        corrections: "✅ Corrections"
    }
};

// 🔥 APPLIQUER LANGUE
function applyLang(){
    let lang = localStorage.getItem("lang") || "fr";

    document.getElementById("title").innerText = langData[lang].title;
    document.getElementById("cours").innerText = langData[lang].cours;
    document.getElementById("devoirs").innerText = langData[lang].devoirs;
    document.getElementById("quiz").innerText = langData[lang].quiz;
    document.getElementById("corrections").innerText = langData[lang].corrections;
}

// 🔥 AU CHARGEMENT
applyLang();

</script>

</body>
</html>
