<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>💬 Chat mondial (temps réel)</h2>

<input id="msg" placeholder="écris un message">
<button onclick="send()">Envoyer</button>

<div id="box" style="margin-top:20px;"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

// ⚠️ IMPORTANT : remplace par ton lien Codespace
const socket = io("https://friendly-capybara-qv749qprvrpxc97j5-3000.app.github.dev/#");

// recevoir messages
socket.on("chat",(data)=>{
document.getElementById("box").innerHTML += "<br>" + data;
});

// envoyer message
function send(){
let m = document.getElementById("msg").value;
socket.emit("chat", m);
}

</script>

</body>
</html>
