<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Plateforme éducative</title>
</head>

<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>🌍 Plateforme Éducative</h2>

<!-- CHAT -->
<input id="msg" placeholder="message">
<button onclick="send()">Envoyer</button>

<div id="chat"></div>

<hr>

<!-- HEURE -->
<h3>Heure locale</h3>
<input id="zone" placeholder="Ex: Africa/Ouagadougou">
<button onclick="getTime()">Voir heure</button>
<div id="time"></div>

<hr>

<!-- IA -->
<h3>🤖 IA éducative</h3>
<select id="ai">
<option value="maths">Maths</option>
<option value="pc">Physique</option>
<option value="svt">SVT</option>
</select>
<button onclick="askAI()">Demander</button>
<div id="aiBox"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

const socket = io("https://bookish-cod-qv749qprvxr6h6wrx-3000.app.github.dev/#");

/* CHAT */

socket.on("chat_history", data => {
  data.forEach(show);
});

socket.on("chat", show);

function show(msg){
  document.getElementById("chat").innerHTML +=
  `<p>[${msg.time}] <b>${msg.user}</b>: ${msg.text}</p>`;
}

function send(){
  let msg = document.getElementById("msg").value;
  socket.emit("chat", msg);
}

/* HEURE */

function getTime(){
  let zone = document.getElementById("zone").value;
  socket.emit("get_time", zone);
}

socket.on("time_response", t => {
  document.getElementById("time").innerText = t;
});

/* IA */

function askAI(){
  let type = document.getElementById("ai").value;
  socket.emit("ai_question", type);
}

socket.on("ai_response", res => {
  document.getElementById("aiBox").innerText = res;
});

</script>

</body>
</html>
