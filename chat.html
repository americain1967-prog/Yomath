<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<input id="name" placeholder="pseudo">
<button onclick="login()">Entrer</button>

<input id="msg">
<button onclick="send()">Envoyer</button>

<input id="q" placeholder="question IA">
<button onclick="ask()">IA</button>

<div id="chat"></div>

<script>
const socket = io("");

function login(){
  socket.emit("register", {pseudo: name.value, classe:"test"});
  socket.emit("get_history");
}

socket.on("history", data=>{
data.forEach(show);
});

socket.on("chat", show);

function show(m){
chat.innerHTML += `<p>${m.user}: ${m.text}</p>`;
}

function send(){
socket.emit("chat", msg.value);
}

function ask(){
socket.emit("ai_chat", q.value);
}

socket.on("ai_reply", r=>{
chat.innerHTML += "<p>IA: "+r+"</p>";
});
</script>
