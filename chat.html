<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chat temps réel</title>
</head>

<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>💬 Chat temps réel</h2>

<input id="msg" placeholder="Écris un message" style="padding:10px;width:200px">
<button onclick="send()" style="padding:10px">Envoyer</button>

<div id="box" style="margin-top:20px"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

// ⚠️ IMPORTANT : remplace par TON lien Codespace
const socket = io("https://friendly-capybara-qv749qprvrpxc97j5.github.dev");

// connexion test
socket.on("connect", () => {
console.log("🟢 CONNECTÉ AU SERVEUR");
});

// recevoir messages
socket.on("chat", (data) => {
document.getElementById("box").innerHTML +=
"<p>💬 " + data + "</p>";
});

// envoyer message
function send() {
let msg = document.getElementById("msg").value;

if(msg.trim() === "") return;

socket.emit("chat", msg);

// vider input
document.getElementById("msg").value = "";
}

</script>

</body>
</html>
