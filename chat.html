<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>💬 Chat Chapitre</h2>

<input id="m">
<button onclick="send()">Envoyer</button>

<div id="box"></div>

<script>

let key="chat";
let msg=JSON.parse(localStorage.getItem(key)||"[]");

function render(){
document.getElementById("box").innerHTML=msg.join("<br>");
}

function send(){
msg.push(localStorage.getItem("player")+": "+document.getElementById("m").value);
localStorage.setItem(key,JSON.stringify(msg));
render();
}

render();

</script>

</body>
</html>
