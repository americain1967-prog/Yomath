<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Startup</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

button{
    width:80%;
    padding:10px;
    margin:6px;
    border-radius:10px;
}

#score{
    font-size:20px;
    margin:10px;
}
</style>
</head>

<body>

<h2 id="title">Quiz</h2>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<!-- LANG -->
<div>
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('en')">EN</button>
<button onclick="setLang('es')">ES</button>
</div>

<hr>

<h3>🏆 Top joueurs</h3>
<div id="ranking"></div>

<button onclick="resetQuiz()">Reset</button>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// ======================
// 🔥 FIREBASE CONFIG
// ======================


firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ======================
// 🌍 LANG SYSTEM
// ======================
const LANG = {
  fr:{title:"Quiz",score:"Score",finish:"Fin du quiz"},
  en:{title:"Quiz",score:"Score",finish:"Quiz finished"},
  es:{title:"Quiz",score:"Puntuación",finish:"Fin del quiz"}
};

let lang = localStorage.getItem("lang") || "fr";

function t(k){
  return LANG[lang][k];
}

function setLang(l){
  lang = l;
  localStorage.setItem("lang", l);
  location.reload();
}

// ======================
// 🧠 QUESTIONS
// ======================
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"BF capitale ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

// ======================
// VARIABLES
// ======================
let i = 0;
let score = 0;

// ======================
// LOAD
// ======================
function load(){

if(i >= QUESTIONS.length){
    end();
    return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html = "";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = t("score") + ": " + score;
}

// ======================
// CHECK
// ======================
function check(n){

if(n === QUESTIONS[i].c){
    score++;
}

i++;
load();
}

// ======================
// END + FIREBASE
// ======================
function end(){

document.getElementById("question").innerText = t("finish");
document.getElementById("answers").innerHTML = "";

// 🔥 SAVE FIREBASE
db.collection("ranking").add({
    score: score,
    lang: lang,
    date: new Date().toString()
});

loadRanking();
}

// ======================
// RANKING
// ======================
function loadRanking(){

db.collection("ranking")
.orderBy("score","desc")
.limit(5)
.get()
.then(snap=>{
let html="";
snap.forEach(doc=>{
html += `<p>⭐ ${doc.data().score}</p>`;
});
document.getElementById("ranking").innerHTML = html;
});
}

// ======================
// RESET
// ======================
function resetQuiz(){
location.reload();
}

// INIT
load();
loadRanking();

</script>

</body>
</html>
