<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Safe Startup</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

button{
    width:80%;
    padding:10px;
    margin:6px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>Quiz Startup</h2>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// ======================
// 🧠 QUIZ (TOUJOURS SAFE)
// ======================
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"BF capitale ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

let i = 0;
let score = 0;

// ======================
// 🔥 FIREBASE SAFE INIT
// ======================
let db = null;

try {



firebase.initializeApp(firebaseConfig);
db = firebase.firestore();

console.log("Firebase connecté ✔");

} catch (e) {
console.log("Firebase NON actif (quiz continue sans erreur)", e);
}

// ======================
// LOAD QUIZ
// ======================
function load(){

if(i >= QUESTIONS.length){
    endQuiz();
    return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html = "";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = "Score: " + score;

}

// ======================
// CHECK
// ======================
function check(n){

if(n === QUESTIONS[i].c){
    score++;
}

i++;
load();
}

// ======================
// END QUIZ + SAFE FIREBASE
// ======================
function endQuiz(){

document.getElementById("question").innerText = "FIN 🎉";
document.getElementById("answers").innerHTML = "";
document.getElementById("score").innerText = "Score final: " + score;

// 🔥 SAFE SAVE (NE CASSE PAS SI FIREBASE FAIL)
if(db){
    db.collection("ranking").add({
        score: score,
        time: new Date().toString()
    }).then(()=>{
        console.log("Score sauvegardé ✔");
    }).catch((e)=>{
        console.log("Firebase erreur mais quiz OK", e);
    });
}

}

load();

</script>

</body>
</html>
