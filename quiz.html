<script>

let supabase = null;

// INIT SAFE
try {
  supabase = window.supabase.createClient(URL, KEY);
} catch(e){
  console.log("Cloud désactivé");
}

// FIN QUIZ
async function saveScore(name, score){

if(!supabase){
console.log("offline mode");
return;
}

try{
await supabase.from("ranking").insert([
{name, score}
]);
}catch(e){
console.log("cloud error ignored");
}

}

</script>
