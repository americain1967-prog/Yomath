<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}
button {
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    width: 80%;
}
</style>
</head>

<body>

<h1 id="title">🧠 Quiz</h1>

<p id="question"></p>
<div id="answers"></div>
<p id="score"></p>

<a href="index.html" id="back">⬅ Retour</a>

<script>

// 🔥 langue unique (stable)
let lang = localStorage.getItem("lang") || "fr";

// 🔥 questions
const questions = {
    fr: [
        {q:"Capitale du Burkina Faso ?", a:["Ouagadougou","Bobo"], c:0},
        {q:"2+2=?", a:["3","4"], c:1}
    ],
    en: [
        {q:"Capital of Burkina Faso?", a:["Ouagadougou","Bobo"], c:0},
        {q:"2+2=?", a:["3","4"], c:1}
    ]
};

// 🔥 sécurité
if(!questions[lang]){
    lang = "fr";
}

// 🔥 interface
const ui = {
    fr: {
        title: "🧠 Quiz",
        back: "⬅ Retour",
        end: "🎉 Fin du quiz",
        score: "Score"
    },
    en: {
        title: "🧠 Quiz",
        back: "⬅ Back",
        end: "🎉 Quiz finished",
        score: "Score"
    }
};

let index = 0;
let score = 0;

function applyLang(){
    let used = ui[lang] ? lang : "fr";

    document.getElementById("title").innerText = ui[used].title;
    document.getElementById("back").innerText = ui[used].back;
}

function load(){
    let q = questions[lang][index];

    document.getElementById("question").innerText = q.q;

    let html="";
    q.a.forEach((ans,i)=>{
        html += `<button onclick="check(${i})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = ui[lang].score + " : " + score;
}

function check(i){
    let q = questions[lang][index];

    if(i === q.c){
        score++;
    }

    index++;

    if(index >= questions[lang].length){
        document.getElementById("question").innerText = ui[lang].end;
        document.getElementById("answers").innerHTML = "";
        return;
    }

    load();
}

// 🔥 lancement propre
applyLang();
load();

</script>

</body>
</html>
