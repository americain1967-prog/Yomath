<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

button {
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

.correct { background: green; }
.wrong { background: red; }
</style>
</head>

<body>

<h1>🧠 Quiz</h1>

<p id="question"></p>

<div id="answers"></div>

<p id="result"></p>
<p id="score">Score : 0</p>

<script>
let score = 0;
let index = 0;

const quiz = [
    {
        q: "Capitale du Burkina Faso ?",
        a: ["Ouagadougou", "Bobo-Dioulasso"],
        correct: 0
    },
    {
        q: "2 + 2 = ?",
        a: ["3", "4"],
        correct: 1
    },
    {
        q: "Couleur du ciel ?",
        a: ["Bleu", "Vert"],
        correct: 0
    }
];

function loadQuestion(){
    if(index >= quiz.length){
        document.getElementById("question").innerText = "🎉 Quiz terminé";
        document.getElementById("answers").innerHTML = "";
        return;
    }

    let q = quiz[index];
    document.getElementById("question").innerText = q.q;

    let html = "";
    q.a.forEach((ans, i) => {
        html += `<button onclick="check(${i})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
}

function check(i){
    let q = quiz[index];

    if(i === q.correct){
        score++;
        document.getElementById("result").innerText = "✔ Bonne réponse";
    } else {
        document.getElementById("result").innerText = "❌ Mauvaise réponse";
    }

    document.getElementById("score").innerText = "Score : " + score;

    index++;
    setTimeout(loadQuestion, 1000);
}

loadQuestion();
</script>

<a href="index.html">Retour</a>

</body>
</html>
