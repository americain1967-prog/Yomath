<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz IA</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center}
button{padding:10px;width:80%;margin:6px;border-radius:10px}
#explain{margin:15px;color:#38bdf8}
</style>
</head>

<body>

<h2>🧠 Quiz Intelligent + Coach</h2>

<p id="player"></p>
<p id="level"></p>
<p id="xp"></p>

<div id="score"></div>

<p id="question"></p>
<div id="answers"></div>

<div id="explain"></div>

<button onclick="next()">➡️ Suivant</button>
<button onclick="home()">🏠 Accueil</button>

<script>

// 👤 joueur
let player = localStorage.getItem("player") || "Anonyme";

// 📊 progression
let data = JSON.parse(localStorage.getItem("progress") || "{}");

let level = data.level || 1;
let xp = data.xp || 0;

let score = 0;
let i = 0;
let mistakes = [];

// 🧠 questions avec explications
const questions = [
{
q:"2+2=?",
a:["3","4","5"],
c:1,
exp:"2+2 = 4 car on additionne les deux nombres."
},
{
q:"Capitale BF ?",
a:["Ouaga","Paris","Accra"],
c:0,
exp:"La capitale du Burkina Faso est Ouagadougou."
},
{
q:"10/2=?",
a:["2","5","10"],
c:1,
exp:"10 divisé par 2 donne 5."
}
];

// affichage joueur
document.getElementById("player").innerText = "👤 " + player;

// LOAD
function load(){

if(i >= questions.length){
end();
return;
}

document.getElementById("question").innerText = questions[i].q;

let html="";
questions[i].a.forEach((a,n)=>{
html += `<button onclick="check(${n})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;

document.getElementById("explain").innerText = "";

updateUI();
}

// CHECK
function check(n){

let q = questions[i];

if(n === q.c){
score++;
xp += 10;
document.getElementById("explain").innerText = "✅ Correct ! " + q.exp;
}else{
xp += 2;
mistakes.push(q);
document.getElementById("explain").innerText = "❌ Faux ! " + q.exp;
}

// désactiver boutons
let buttons = document.querySelectorAll("button");
buttons.forEach(b=>b.disabled = true);

}

// NEXT
function next(){
i++;

// réactiver boutons
let buttons = document.querySelectorAll("button");
buttons.forEach(b=>b.disabled = false);

load();
}

// FIN
function end(){

document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
document.getElementById("answers").innerHTML = "";
document.getElementById("explain").innerText = "";

// montée niveau
if(xp >= level * 50){
level++;
xp = 0;
alert("🔥 Niveau supérieur !");
}

// sauvegarde progression
localStorage.setItem("progress", JSON.stringify({
level: level,
xp: xp
}));

saveRanking();

// 👉 ENTRAINEMENT AUTOMATIQUE
if(mistakes.length > 0){
startTraining();
}else{
document.getElementById("score").innerText = "Parfait ! Aucune erreur 🎯";
}
}

// 🧠 ENTRAINEMENT
function startTraining(){

i = 0;
questions.splice(0, questions.length, ...mistakes);

mistakes = [];

document.getElementById("question").innerText = "🧠 Mode entraînement (corrige tes erreurs)";
load();
}

// UI
function updateUI(){
document.getElementById("score").innerText = "Score: " + score;
document.getElementById("level").innerText = "Niveau: " + level;
document.getElementById("xp").innerText = "XP: " + xp;
}

// classement
function saveRanking(){

let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

ranking.push({
name: player,
score: score,
level: level
});

ranking.sort((a,b)=>b.score-a.score);
ranking = ranking.slice(0,5);

localStorage.setItem("ranking", JSON.stringify(ranking));
}

// home
function home(){
window.location.href = "index.html";
}

// start
load();

</script>

</body>
</html>
