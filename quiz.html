<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Game</title>
</head>

<body style="font-family:Arial;text-align:center;background:#0f172a;color:white">

<h2>🧠 Quiz Game</h2>

<p id="info"></p>

<p id="question"></p>
<div id="answers"></div>

<p id="result"></p>

<button onclick="next()">➡️ Suivant</button>

<script>

let player = localStorage.getItem("player") || "Anonyme";
let mode = localStorage.getItem("mode") || "solo";
let opponent = localStorage.getItem("opponent") || "CPU";

// scores
let scoreP1 = 0;
let scoreP2 = 0;

let score = 0;
let i = 0;
let turn = 1;

// questions simples (IA légère)
function generateQuestion(){

let pool = [
{q:"2 + 2 ?", a:["3","4","5"], c:1},
{q:"5 - 1 ?", a:["4","3","2"], c:0},
{q:"10 / 2 ?", a:["2","5","10"], c:1},
{q:"3 + 3 ?", a:["5","6","7"], c:1},
{q:"7 - 2 ?", a:["4","5","6"], c:1}
];

return pool[Math.floor(Math.random()*pool.length)];
}

let currentQ = generateQuestion();

// info
document.getElementById("info").innerText =
mode === "duel"
? `⚔️ Duel: ${player} vs ${opponent}`
: `🎮 Joueur: ${player}`;

// LOAD
function load(){

if(i >= 10){
endGame();
return;
}

currentQ = generateQuestion();

document.getElementById("question").innerText = currentQ.q;

let html = "";

currentQ.a.forEach((a,n)=>{
html += `<button onclick="check(${n})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("result").innerText = "";

}

// CHECK
function check(n){

if(mode === "duel"){

    if(turn === 1){
        if(n === currentQ.c) scoreP1++;
        document.getElementById("result").innerText = "👉 Tour adversaire";
        turn = 2;
    } 
    else {
        if(n === currentQ.c) scoreP2++;
        document.getElementById("result").innerText = "👉 Ton tour";
        turn = 1;
        i++;
        load();
    }

}else{

    if(n === currentQ.c){
        score++;
        document.getElementById("result").innerText = "✅ Correct";
    }else{
        document.getElementById("result").innerText = "❌ Faux";
    }

}
}

// NEXT
function next(){

if(mode !== "duel"){
i++;
load();
}
}

// END GAME
function endGame(){

document.getElementById("question").innerText = "🏁 Fin du Quiz";
document.getElementById("answers").innerHTML = "";

if(mode === "duel"){

document.getElementById("result").innerHTML =
`<h3>${player}: ${scoreP1}</h3>
<h3>${opponent}: ${scoreP2}</h3>`;

}else{

document.getElementById("result").innerHTML =
`🎯 Score: ${score}`;
}

}

// START
load();

</script>

</body>
</html>
