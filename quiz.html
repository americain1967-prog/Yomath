<!DOCTYPE html>
<html>
<body style="background:#0f172a;color:white;text-align:center">

<h2>🎮 Quiz</h2>

<p>Combien font 2 + 2 ?</p>

<button onclick="check(3)">3</button>
<button onclick="check(4)">4</button>
<button onclick="check(5)">5</button>

<p id="res"></p>

<script>
function check(n){
if(n==4){
document.getElementById("res").innerText="✅ Correct";
}else{
document.getElementById("res").innerText="❌ Faux";
}
}
</script>

</body>
</html>
