<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Startup Offline</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

button{
    width:80%;
    padding:10px;
    margin:6px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>Quiz Startup</h2>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<hr>

<h3>🏆 Top local</h3>
<div id="ranking"></div>

<script>

// ======================
// 🧠 QUESTIONS
// ======================
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"BF capitale ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

let i = 0;
let score = 0;

// ======================
// LOAD
// ======================
function load(){

if(i >= QUESTIONS.length){
    endQuiz();
    return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html = "";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = "Score: " + score;

}

// ======================
// CHECK
// ======================
function check(n){

if(n === QUESTIONS[i].c){
    score++;
}

i++;
load();
}

// ======================
// END + CLASSEMENT LOCAL
// ======================
function endQuiz(){

document.getElementById("question").innerText = "FIN 🎉";
document.getElementById("answers").innerHTML = "";
document.getElementById("score").innerText = "Score final: " + score;

// 🔥 SAVE LOCAL
let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

ranking.push(score);

// tri décroissant
ranking.sort((a,b)=>b-a);

// garder top 5
ranking = ranking.slice(0,5);

localStorage.setItem("ranking", JSON.stringify(ranking));

showRanking();
}

// ======================
// AFFICHER CLASSEMENT
// ======================
function showRanking(){

let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

let html = "";

ranking.forEach((s,i)=>{
html += `<p>🏆 ${i+1}. ${s}</p>`;
});

document.getElementById("ranking").innerHTML = html;
}

load();
showRanking();

</script>

</body>
</html>
