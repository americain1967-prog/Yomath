<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Startup Clean</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

button{
    width:80%;
    padding:10px;
    margin:6px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>Quiz Startup</h2>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// ======================
// 🔥 FIREBASE INIT (SAFE)
// ======================
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBewu-Mse6_b7mHXiEUYUtBDipVWYLHrM4",
  authDomain: "yomath-65f8f.firebaseapp.com",
  projectId: "yomath-65f8f",
  storageBucket: "yomath-65f8f.firebasestorage.app",
  messagingSenderId: "19067457942",
  appId: "1:19067457942:web:dd9e4363d5dee48b02cdb7",
  measurementId: "G-JNZ6Q77FXT"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ======================
// 🧠 QUESTIONS
// ======================
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"BF capitale ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

// ======================
// VARIABLES
// ======================
let i = 0;
let score = 0;

// ======================
// LOAD QUIZ
// ======================
function load(){

if(i >= QUESTIONS.length){
    endQuiz();
    return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html = "";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = "Score: " + score;

}

// ======================
// CHECK ANSWER (IMPORTANT)
// ======================
function check(n){

if(n === QUESTIONS[i].c){
    score = score + 1;
}

i = i + 1;
load();
}

// ======================
// END + FIREBASE SAVE
// ======================
function endQuiz(){

document.getElementById("question").innerText = "FIN 🎉";
document.getElementById("answers").innerHTML = "";
document.getElementById("score").innerText = "Score final: " + score;

// 🔥 SAFE FIREBASE SAVE
db.collection("ranking").add({
    score: Number(score),
    time: new Date().toString()
}).then(()=>{
    console.log("Score envoyé Firebase ✔");
}).catch((e)=>{
    console.log("Erreur Firebase ❌", e);
});

}

// START
load();

</script>

</body>
</html>
