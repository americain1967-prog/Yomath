<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz + Firebase</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;}
button{width:80%;padding:10px;margin:5px;}
</style>
</head>

<body>

<h2>Quiz</h2>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// 🔥 FIREBASE CONFIG (À REMPLACER)
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBewu-Mse6_b7mHXiEUYUtBDipVWYLHrM4",
  authDomain: "yomath-65f8f.firebaseapp.com",
  projectId: "yomath-65f8f",
  storageBucket: "yomath-65f8f.firebasestorage.app",
  messagingSenderId: "19067457942",
  appId: "1:19067457942:web:f3ddc16bdc7d9bcf02cdb7",
  measurementId: "G-7DSY6QYM50"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

// INIT
let db = null;

try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    console.log("Firebase OK");
} catch(e){
    console.log("Firebase error", e);
}

// QUESTIONS
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"Capitale BF?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

let i = 0;
let score = 0;

// LOAD
function load(){

    if(i >= QUESTIONS.length){
        end();
        return;
    }

    document.getElementById("question").innerText = QUESTIONS[i].q;

    let html = "";
    QUESTIONS[i].a.forEach((a,idx)=>{
        html += `<button onclick="check(${idx})">${a}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = "Score: " + score;
}

// CHECK
function check(n){

    if(n === QUESTIONS[i].c){
        score++;
    }

    i++;
    load();
}

// END + FIREBASE
function end(){

    document.getElementById("question").innerText = "FIN 🎉";
    document.getElementById("answers").innerHTML = "";

    document.getElementById("score").innerText = "Score final: " + score;

    // 🔥 ENVOI FIREBASE
    if(db){
        db.collection("scores").add({
            score: score,
            date: new Date().toString()
        }).then(()=>{
            console.log("Score envoyé");
        }).catch((e)=>{
            console.log("Erreur Firebase", e);
        });
    }
}

load();

</script>

</body>
</html>
