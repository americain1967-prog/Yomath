<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Engine</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
}

button{
    width:80%;
    padding:12px;
    margin:8px;
    border:none;
    border-radius:10px;
}

#timer{
    color:orange;
    font-size:18px;
}
</style>
</head>

<body>

<h1>🧠 Quiz Engine</h1>

<div id="timer">⏱ 30</div>
<div id="score">Score: 0</div>

<p id="question">Loading...</p>
<div id="answers"></div>

<script>

// ======================
// 🌍 LANG
// ======================
let lang = localStorage.getItem("lang") || "fr";

// ======================
// 🧠 QUESTIONS (20+ READY BASE)
// ======================
const QUESTIONS = [
{q:{fr:"Capitale Burkina Faso ?",en:"Capital Burkina Faso?"},a:["Ouaga","Bobo","Accra","Lagos"],c:0},
{q:{fr:"2+2 ?",en:"2+2?"},a:["3","4","5","6"],c:1},
{q:{fr:"HTML est ?",en:"HTML is?"},a:["Langage","Animal","Voiture","Jeu"],c:0},
{q:{fr:"JavaScript sert à ?",en:"JS is for?"},a:["Web","Cuisine","Sport","Musique"],c:0},
{q:{fr:"10/2 ?",en:"10/2?"},a:["2","5","10","20"],c:1}
];

// ======================
let i=0;
let score=0;
let time=30;

// ======================
// ⏱ TIMER
// ======================
let timer=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="⏱ "+time;

    if(time<=0) end();
},1000);

// ======================
// 📌 LOAD
// ======================
function load(){

if(i>=QUESTIONS.length) return end();

let q=QUESTIONS[i].q[lang]||QUESTIONS[i].q.fr;

document.getElementById("question").innerText=q;

let html="";

QUESTIONS[i].a.forEach((a,idx)=>{
html+=`<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML=html;
document.getElementById("score").innerText="Score: "+score;
}

// ======================
// ✅ CHECK
// ======================
function check(n){
if(n===QUESTIONS[i].c) score++;
i++;
load();
}

// ======================
// 🏁 END
// ======================
function end(){
clearInterval(timer);

document.getElementById("question").innerText="🎉 FIN";
document.getElementById("answers").innerHTML="";
document.getElementById("score").innerText="Score final: "+score;

// 🏆 SAVE
let board=JSON.parse(localStorage.getItem("board")||"[]");
board.push(score);
board.sort((a,b)=>b-a);
localStorage.setItem("board",JSON.stringify(board));

}

load();

</script>

</body>
</html>
