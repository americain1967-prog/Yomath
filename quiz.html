<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Simple</title>
</head>

<body style="font-family:Arial;text-align:center;background:#0f172a;color:white">

<h2>🌍 Quiz</h2>

<div id="score">Score: 0</div>

<p id="question"></p>
<div id="answers"></div>

<script>

// 🧠 QUESTIONS
const questions = [
  {
    q: "2 + 2 = ?",
    a: ["3", "4", "5"],
    c: 1
  },
  {
    q: "Capitale du Burkina Faso ?",
    a: ["Ouagadougou", "Bamako", "Dakar"],
    c: 0
  },
  {
    q: "10 / 2 = ?",
    a: ["2", "5", "10"],
    c: 1
  }
];

let i = 0;
let score = 0;

// 📥 CHARGER QUESTION
function loadQuestion() {

  document.getElementById("question").innerText = questions[i].q;

  let html = "";

  questions[i].a.forEach((answer, index) => {
    html += `<button onclick="checkAnswer(${index})">${answer}</button><br><br>`;
  });

  document.getElementById("answers").innerHTML = html;
  document.getElementById("score").innerText = "Score: " + score;
}

// ✅ CHECK REPONSE
function checkAnswer(index) {

  if (index === questions[i].c) {
    score++;
  }

  i++;

  if (i >= questions.length) {
    endQuiz();
  } else {
    loadQuestion();
  }
}

// 🏁 FIN QUIZ
function endQuiz() {
  document.getElementById("question").innerText = "🎉 Quiz terminé !";
  document.getElementById("answers").innerHTML = "";
  document.getElementById("score").innerText = "Score final: " + score;
}

// START
loadQuestion();

</script>

</body>
</html>
