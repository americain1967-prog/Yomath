<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz World AI</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
button{
  padding:10px;
  width:80%;
  margin:6px;
  border-radius:10px;
}
.box{
  margin-top:15px;
  border-top:1px solid #334155;
  padding-top:10px;
}
</style>
</head>

<body>

<h2>🌍 Quiz World AI</h2>

<p id="player"></p>
<p id="profile"></p>

<p id="question"></p>
<div id="answers"></div>

<p id="result"></p>

<button onclick="next()">➡️ Suivant</button>
<button onclick="showWorld()">🌍 Classement mondial</button>
<button onclick="home()">🏠 Accueil</button>

<!-- WORLD RANKING -->
<div class="box">
<h3>🌍 Classement mondial (simulation)</h3>
<div id="world"></div>
</div>

<script>

let player = localStorage.getItem("player") || "Anonyme";

// stats joueur
let data = JSON.parse(localStorage.getItem("progress") || "{}");
let level = data.level || 1;
let xp = data.xp || 0;
let score = 0;

let i = 0;

// 🧠 IA ULTRA SIMPLE (génération intelligente)
function generateAIQuestion(level){

let topics = {
easy:[
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"5-1=?",a:["4","3","2"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
],

medium:[
{q:"12/3=?",a:["3","4","6"],c:1},
{q:"7+8=?",a:["14","15","16"],c:1},
{q:"9-4=?",a:["6","5","4"],c:1}
],

hard:[
{q:"18/3+2=?",a:["6","8","7"],c:0},
{q:"25-5*2=?",a:["10","15","20"],c:0},
{q:"(4+6)/2=?",a:["5","6","7"],c:0}
]
};

let pool =
level <= 2 ? topics.easy :
level <= 4 ? topics.medium :
topics.hard;

// IA légère: mélange + adaptation
let q = pool[Math.floor(Math.random()*pool.length)];

return q;
}

let currentQ = generateAIQuestion(level);

// 👤 PROFIL
function updateProfile(){

document.getElementById("player").innerText =
"👤 " + player;

document.getElementById("profile").innerText =
`⭐ Niveau: ${level} | XP: ${xp} | Score: ${score}`;
}

// LOAD
function load(){

document.getElementById("question").innerText = currentQ.q;

let html = "";

currentQ.a.forEach((a,n)=>{
html += `<button onclick="check(${n})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("result").innerText = "";

updateProfile();
}

// CHECK
function check(n){

if(n === currentQ.c){
score++;
xp += 10;
document.getElementById("result").innerText = "✅ Correct";
}else{
xp += 3;
document.getElementById("result").innerText = "❌ Faux";
}

document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);

// LEVEL SYSTEM
if(xp >= level * 50){
level++;
xp = 0;
alert("🔥 Niveau supérieur !");
}

saveProgress();
addWorldScore();
}

// NEXT QUESTION
function next(){

currentQ = generateAIQuestion(level);

document.querySelectorAll("#answers button").forEach(b=>b.disabled=false);

load();
}

// 💾 SAVE
function saveProgress(){
localStorage.setItem("progress", JSON.stringify({level,xp}));
}

// 🌍 COMPÉTITION MONDIALE (SIMULATION)
function addWorldScore(){

let world = JSON.parse(localStorage.getItem("world") || "[]");

world.push({
name:player,
score:score,
level:level,
time:new Date().toLocaleTimeString()
});

world.sort((a,b)=>b.score-a.score);

world = world.slice(0,10);

localStorage.setItem("world", JSON.stringify(world));
}

function showWorld(){

let world = JSON.parse(localStorage.getItem("world") || "[]");

document.getElementById("world").innerHTML =
world.map((p,i)=>
`🏆 ${i+1}. ${p.name} - ${p.score} pts (lvl ${p.level})`
).join("<br>") || "Aucun joueur";
}

// HOME
function home(){
window.location.href="index.html";
}

// INIT
updateProfile();
load();

</script>

</body>
</html>
