<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}
button {
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
}
</style>
</head>

<body>

<h1 data-key="quiz_title">🧠 Quiz</h1>
<p data-key="quiz_text">Réponds aux questions</p>

<a href="index.html" data-key="back">⬅ Retour</a>

<script>
const translations = {
    fr: {
        quiz_title: "🧠 Quiz",
        quiz_text: "Réponds aux questions",
        back: "⬅ Retour"
    },
    en: {
        quiz_title: "🧠 Quiz",
        quiz_text: "Answer the questions",
        back: "⬅ Back"
    }
};

function setLang(lang){
    localStorage.setItem("lang", lang);

    document.querySelectorAll("[data-key]").forEach(el=>{
        let key = el.getAttribute("data-key");
        el.innerText = translations[lang][key];
    });
}

window.onload = ()=>{
    setLang(localStorage.getItem("lang") || "fr");
}
</script>

</body>
</html>
