<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Quiz</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
}

.header{
    padding:15px;
    font-size:20px;
}

.box{
    margin:10px;
}

button{
    width:80%;
    padding:12px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

#timer{
    font-size:18px;
    color:orange;
}
</style>
</head>

<body>

<div class="header">🧠 Startup Quiz</div>

<div id="timer">⏱ 30</div>
<div class="box" id="score">Score: 0</div>

<p id="question">Loading...</p>
<div id="answers"></div>

<!-- 🔥 STARTUP MODULES -->
<script src="app.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>

<script>

// ======================
// 🚀 STARTUP QUIZ ENGINE
// ======================

let lang = getLang();
let i = 0;
let score = 0;
let time = 30;

// TIMER
let timer = setInterval(() => {
    time--;
    document.getElementById("timer").innerText = "⏱ " + time;

    if(time <= 0){
        endQuiz();
    }
}, 1000);

// LOAD QUESTION
function loadQuestion(){

    if(i >= QUESTIONS.length){
        endQuiz();
        return;
    }

    let q = QUESTIONS[i].q[lang] || QUESTIONS[i].q.fr;

    document.getElementById("question").innerText = q;

    let html = "";

    QUESTIONS[i].a.forEach((ans, idx) => {
        html += `<button onclick="checkAnswer(${idx})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = "Score: " + score;
}

// CHECK ANSWER
function checkAnswer(n){

    if(n === QUESTIONS[i].c){
        score++;
    }

    i++;
    loadQuestion();
}

// END QUIZ
function endQuiz(){

    clearInterval(timer);

    document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
    document.getElementById("answers").innerHTML = "";

    document.getElementById("score").innerText = "Score final: " + score;

    // 💾 SAVE LOCAL RANKING
    saveScore(score);

    // 📲 SEND TELEGRAM
    sendToTelegram(score);
}

// START
loadQuestion();

</script>

</body>
</html>
