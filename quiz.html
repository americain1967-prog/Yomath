<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}

button {
    margin: 10px;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 16px;
}

.correct { background: green; }
.wrong { background: red; }
</style>
</head>

<body>

<h1>🧠 Quiz</h1>

<p>Capitale du Burkina Faso ?</p>

<button onclick="check(this, true)">Ouagadougou</button>
<button onclick="check(this, false)">Bobo-Dioulasso</button>

<p id="result"></p>
<p id="score">Score : 0</p>

<script>
let score = 0;
let answered = false;

function check(btn, isCorrect){
    if(answered) return;

    let result = document.getElementById("result");
    let scoreText = document.getElementById("score");

    if(isCorrect){
        score++;
        btn.classList.add("correct");
        result.innerText = "✔ Bonne réponse";
    } else {
        btn.classList.add("wrong");
        result.innerText = "❌ Mauvaise réponse";
    }

    scoreText.innerText = "Score : " + score;
    answered = true;
}
</script>

<a href="index.html">Retour</a>

</body>
</html>
