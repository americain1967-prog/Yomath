<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Final</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}
button{
    width:80%;
    padding:10px;
    margin:6px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>🌍 Quiz Final</h2>

<div id="score">Score: 0</div>
<p id="question">Chargement...</p>
<div id="answers"></div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// =====================
// 🔥 FIREBASE CONFIG
// =====================


// =====================
// INIT SAFE
// =====================
let db = null;

try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    console.log("Firebase OK");
}catch(e){
    console.log("Firebase error", e);
}

// =====================
// 🧠 QUESTIONS
// =====================
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5","6"],c:1},
{q:"Capitale Burkina Faso ?",a:["Ouaga","Bobo","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10","20"],c:1},
{q:"HTML est ?",a:["Langage","Jeu","Animal","Voiture"],c:0},
{q:"JS sert à ?",a:["Web","Cuisine","Sport","Musique"],c:0}
];

// =====================
// VARIABLES
// =====================
let i = 0;
let score = 0;

// =====================
// LOAD QUESTION
// =====================
function load(){

if(i >= QUESTIONS.length){
    end();
    return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html = "";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = "Score: " + score;

}

// =====================
// CHECK ANSWER
// =====================
function check(n){

if(n === QUESTIONS[i].c){
    score++;
}

i++;
load();
}

// =====================
// END QUIZ
// =====================
function end(){

document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
document.getElementById("answers").innerHTML = "";
document.getElementById("score").innerText = "Score final: " + score;

// 🔥 DEBUG
console.log("FINAL SCORE =", score);

// 🔥 FIREBASE SAVE
if(db){
    db.collection("scores").add({
        score: Number(score),
        date: new Date().toString()
    }).then(()=>{
        console.log("Score envoyé OK");
    }).catch((e)=>{
        console.log("Erreur Firebase", e);
    });
}

}

load();

</script>

</body>
</html>
