<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}
button{
    padding:10px;
    width:80%;
    margin:6px;
    border-radius:10px;
}
</style>
</head>

<body>

<h2>🎮 Quiz</h2>

<p id="player"></p>
<p id="level"></p>
<div id="score">Score: 0</div>

<p id="question"></p>
<div id="answers"></div>

<button onclick="restart()">🔄 Rejouer</button>
<button onclick="home()">🏠 Accueil</button>

<script>

// 👤 joueur
let player = localStorage.getItem("player") || "Anonyme";

// 📊 progression
let score = 0;
let i = 0;
let level = 1;

// 🧠 questions
const questions = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"Capitale BF ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1},
{q:"HTML est ?",a:["Langage","Jeu","Sport"],c:0},
{q:"JS sert à ?",a:["Web","Cuisine","Foot"],c:0}
];

// afficher joueur
document.getElementById("player").innerText = "👤 " + player;

// load question
function load(){

if(i >= questions.length){
end();
return;
}

document.getElementById("question").innerText = questions[i].q;

let html = "";

questions[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;

updateUI();
}

// vérifier réponse
function check(n){

if(n === questions[i].c){
score++;
}

i++;

// niveaux automatiques
if(score >= 3) level = 2;
if(score >= 5) level = 3;

load();
}

// fin
function end(){

document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
document.getElementById("answers").innerHTML = "";

// sauvegarde classement
let ranking = JSON.parse(localStorage.getItem("ranking") || "[]");

ranking.push({
name: player,
score: score,
level: level
});

ranking.sort((a,b)=>b.score-a.score);
ranking = ranking.slice(0,5);

localStorage.setItem("ranking", JSON.stringify(ranking));
}

// UI
function updateUI(){
document.getElementById("score").innerText = "Score: " + score;
document.getElementById("level").innerText = "Niveau: " + level;
}

// restart
function restart(){
score = 0;
i = 0;
level = 1;
load();
}

// retour accueil
function home(){
window.location.href = "index.html";
}

// start
load();

</script>

</body>
</html>
