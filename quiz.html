<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Global Startup</title>

<!-- 🔥 anti-cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    margin:0;
}

h1{margin-top:20px;}

button{
    width:80%;
    padding:12px;
    margin:8px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

#timer{color:orange;font-size:18px;}
</style>
</head>

<body>

<h1>🌍 Quiz Global Startup</h1>

<div id="timer">⏱ 30</div>
<div id="score">Score: 0</div>

<p id="question">Chargement...</p>
<div id="answers"></div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// ======================
// 🔥 FIREBASE CONFIG
// ======================



// ======================
// 🔥 INIT SAFE
// ======================
let db = null;

try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    console.log("Firebase connecté");
}catch(e){
    console.log("Firebase erreur:", e);
}

// ======================
// 🌍 LANG
// ======================
let lang = localStorage.getItem("lang") || "fr";

// ======================
// 🧠 QUESTIONS (20+ READY BASE SIMPLIFIÉE)
// ======================
const QUESTIONS = [
{q:{fr:"Capitale Burkina Faso ?",en:"Capital Burkina Faso?"},a:["Ouaga","Bobo","Accra","Paris"],c:0},
{q:{fr:"2 + 2 = ?",en:"2 + 2?"},a:["3","4","5","6"],c:1},
{q:{fr:"HTML est ?",en:"HTML is?"},a:["Langage","Animal","Voiture","Jeu"],c:0},
{q:{fr:"JS sert à ?",en:"JS is for?"},a:["Web","Sport","Cuisine","Musique"],c:0},
{q:{fr:"10 / 2 = ?",en:"10 / 2?"},a:["2","5","10","20"],c:1}
];

// ======================
// 🔁 STATE (ANTI PERTE)
// ======================
let i = Number(localStorage.getItem("quiz_i")) || 0;
let score = Number(localStorage.getItem("quiz_score")) || 0;
let time = 30;

// ======================
// ⏱ TIMER
// ======================
let timer = setInterval(()=>{
    time--;
    document.getElementById("timer").innerText = "⏱ " + time;

    if(time <= 0){
        end();
    }
},1000);

// ======================
// 📌 LOAD QUESTION
// ======================
function load(){

    if(i >= QUESTIONS.length){
        end();
        return;
    }

    let q = QUESTIONS[i].q[lang] || QUESTIONS[i].q.fr;

    document.getElementById("question").innerText = q;

    let html = "";

    QUESTIONS[i].a.forEach((a,idx)=>{
        html += `<button onclick="check(${idx})">${a}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = "Score: " + score;

    // 🔥 SAVE STATE
    localStorage.setItem("quiz_i", i);
    localStorage.setItem("quiz_score", score);
}

// ======================
// ✅ CHECK ANSWER
// ======================
function check(n){

    if(n === QUESTIONS[i].c){
        score++;
    }

    i++;
    load();
}

// ======================
// 🏁 END QUIZ
// ======================
function end(){

    clearInterval(timer);

    document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("score").innerText = "Score final: " + score;

    // reset local state
    localStorage.removeItem("quiz_i");
    localStorage.removeItem("quiz_score");

    // 🔥 SAVE FIREBASE
    if(db){
        db.collection("scores").add({
            score: score,
            date: new Date(),
            lang: lang
        });
    }
}

// ======================
load();

</script>

</body>
</html>
