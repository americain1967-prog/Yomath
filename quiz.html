<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Ultimate</title>

<style>
body{
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    margin: 0;
}

button{
    width: 80%;
    padding: 12px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

#timer{
    color: orange;
    font-size: 18px;
}
</style>
</head>

<body>

<h1>🧠 Quiz Ultimate</h1>

<div id="timer">⏱ 30</div>
<p id="score">Score: 0</p>

<p id="question">Loading...</p>
<div id="answers"></div>

<script>

// =====================
// 🔥 TOUT EN UN FICHIER
// =====================

let i = 0;
let score = 0;
let time = 30;

// 🔥 QUESTIONS DIRECTEMENT ICI
const QUESTIONS = [
{
q:{fr:"Capitale du Burkina Faso ?",en:"Capital of Burkina Faso?"},
a:["Ouagadougou","Bobo","Accra","Paris"],
c:0
},
{
q:{fr:"2 + 2 = ?",en:"2 + 2 = ?"},
a:["3","4","5","6"],
c:1
},
{
q:{fr:"HTML est un ?",en:"HTML is a ?"},
a:["Langage","Animal","Voiture","Jeu"],
c:0
}
];

// 🔥 langue simple
let lang = localStorage.getItem("lang") || "fr";

// =====================
// ⏱ TIMER
// =====================
let t = setInterval(()=>{
    time--;
    document.getElementById("timer").innerText = "⏱ " + time;

    if(time <= 0){
        end();
    }
},1000);

// =====================
// 📌 LOAD QUESTION
// =====================
function load(){

    if(i >= QUESTIONS.length){
        end();
        return;
    }

    let q = QUESTIONS[i].q[lang] || QUESTIONS[i].q.fr;

    document.getElementById("question").innerText = q;

    let html = "";

    QUESTIONS[i].a.forEach((a,idx)=>{
        html += `<button onclick="check(${idx})">${a}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = "Score: " + score;
}

// =====================
// ✅ CHECK
// =====================
function check(n){
    if(n === QUESTIONS[i].c){
        score++;
    }

    i++;
    load();
}

// =====================
// 🏁 END
// =====================
function end(){
    clearInterval(t);

    document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("score").innerText = "Score final: " + score;
}

// =====================
load();

</script>

</body>
</html>
