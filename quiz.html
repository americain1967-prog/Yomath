<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>🎮 Quiz IA</h2>

<p id="q"></p>

<div id="a"></div>

<p id="r"></p>

<script>

let player=localStorage.getItem("player");
let matiere=localStorage.getItem("matiere");
let score=0;

function gen(){

if(matiere=="math"){
return {q:"2+3=?",a:["4","5","6"],c:1};
}

if(matiere=="pc"){
return {q:"Unité énergie ?",a:["Joule","Volt","Kg"],c:0};
}

return {q:"Respiration organe ?",a:["Cœur","Poumon","Foie"],c:1};
}

let cur=gen();

function load(){
document.getElementById("q").innerText=cur.q;

let h="";
cur.a.forEach((x,i)=>{
h+=`<button onclick="check(${i})">${x}</button><br>`;
});

document.getElementById("a").innerHTML=h;
}

function check(i){

if(i==cur.c){
score++;
document.getElementById("r").innerText="✅ Correct";
}else{
document.getElementById("r").innerText="❌ Faux";
}

localStorage.setItem("score",score);
}

load();

</script>

</body>
</html>
