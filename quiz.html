<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Test</title>

<style>
body{font-family:Arial;text-align:center;background:#0f172a;color:white;}
button{margin:10px;padding:10px;width:80%;}
</style>
</head>

<body>

<h2>Quiz Test</h2>

<div id="score">Score: 0</div>
<p id="question">Chargement...</p>
<div id="answers"></div>

<script>

// QUESTIONS
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"Capitale du Burkina Faso ?",a:["Ouaga","Paris","Accra"],c:0}
];

let i=0;
let score=0;

// LOAD
function load(){
if(i>=QUESTIONS.length){
document.getElementById("question").innerText="FIN 🎉";
document.getElementById("answers").innerHTML="";
return;
}

document.getElementById("question").innerText=QUESTIONS[i].q;

let html="";
QUESTIONS[i].a.forEach((a,idx)=>{
html+=`<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML=html;
document.getElementById("score").innerText="Score: "+score;
}

// CHECK
function check(n){
if(n===QUESTIONS[i].c) score++;
i++;
load();
}

load();

</script>

</body>
</html>
