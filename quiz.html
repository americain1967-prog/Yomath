<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Global</title>

<style>
body{
    font-family:Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

button{
    width:80%;
    padding:12px;
    margin:8px;
    border-radius:10px;
}

#timer{
    color:orange;
}
</style>
</head>

<body>

<h1>🌍 Quiz Global</h1>

<div id="timer">⏱ 30</div>
<div id="score">Score: 0</div>

<p id="question">Loading...</p>
<div id="answers"></div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// 🔴 COLLE TON firebaseConfig ICI
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBewu-Mse6_b7mHXiEUYUtBDipVWYLHrM4",
  authDomain: "yomath-65f8f.firebaseapp.com",
  projectId: "yomath-65f8f",
  storageBucket: "yomath-65f8f.firebasestorage.app",
  messagingSenderId: "19067457942",
  appId: "1:19067457942:web:f3ddc16bdc7d9bcf02cdb7",
  measurementId: "G-7DSY6QYM50"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
};

// 🔥 INIT FIREBASE
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ======================
// 🌍 LANGUE
// ======================
let lang = localStorage.getItem("lang") || "fr";

// ======================
// 🧠 QUESTIONS
// ======================
const QUESTIONS = [
{q:{fr:"Capitale Burkina Faso ?",en:"Capital Burkina Faso?"},a:["Ouaga","Bobo","Accra","Lagos"],c:0},
{q:{fr:"2+2 ?",en:"2+2?"},a:["3","4","5","6"],c:1},
{q:{fr:"HTML est ?",en:"HTML is?"},a:["Langage","Animal","Voiture","Jeu"],c:0},
{q:{fr:"JavaScript sert à ?",en:"JS is for?"},a:["Web","Cuisine","Sport","Musique"],c:0},
{q:{fr:"10/2 ?",en:"10/2?"},a:["2","5","10","20"],c:1}
];

let i=0;
let score=0;
let time=30;

// ======================
// ⏱ TIMER
// ======================
let timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="⏱ "+time;

if(time<=0) end();
},1000);

// ======================
// LOAD
// ======================
function load(){
if(i>=QUESTIONS.length) return end();

let q=QUESTIONS[i].q[lang] || QUESTIONS[i].q.fr;

document.getElementById("question").innerText=q;

let html="";
QUESTIONS[i].a.forEach((a,idx)=>{
html+=`<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML=html;
document.getElementById("score").innerText="Score: "+score;
}

// ======================
// CHECK
// ======================
function check(n){
if(n===QUESTIONS[i].c) score++;
i++;
load();
}

// ======================
// END + FIREBASE SAVE
// ======================
function end(){

clearInterval(timer);

document.getElementById("question").innerText="🎉 FIN";
document.getElementById("answers").innerHTML="";
document.getElementById("score").innerText="Score final: "+score;

// 🔥 SAVE ONLINE
db.collection("scores").add({
score: score,
date: new Date(),
lang: lang
});

}

// START
load();

</script>

</body>
</html>
