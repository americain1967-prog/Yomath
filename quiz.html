<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
}
button {
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    width: 80%;
}
</style>
</head>

<body>

<h1 data-key="quiz_title">🧠 Quiz</h1>

<p id="question"></p>
<div id="answers"></div>
<p id="score"></p>

<a href="index.html" data-key="back">⬅ Retour</a>

<!-- 🔥 LANG SYSTEM -->
<script src="lang.js"></script>

<script>
// 🔥 langue globale
let lang = getLang();

// 🔥 questions (FR + EN seulement)
const questions = {
    fr: [
        {q:"Capitale du Burkina Faso ?", a:["Ouagadougou","Bobo"], c:0},
        {q:"2+2=?", a:["3","4"], c:1},
        {q:"dérivée de x² ?", a:["2x","x"], c:0}
    ],
    en: [
        {q:"Capital of Burkina Faso?", a:["Ouagadougou","Bobo"], c:0},
        {q:"2+2=?", a:["3","4"], c:1},
        {q:"Derivative of x²?", a:["2x","x"], c:0}
    ]
};

// 🔥 fallback si langue non supportée
if(!questions[lang]){
    lang = "fr";
}

let index = 0;
let score = 0;

function load(){
    let q = questions[lang][index];

    document.getElementById("question").innerText = q.q;

    let html="";
    q.a.forEach((ans,i)=>{
        html += `<button onclick="check(${i})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = "Score : " + score;
}

function check(i){
    let q = questions[lang][index];

    if(i === q.c){
        score++;
    }

    index++;

    if(index >= questions[lang].length){
        document.getElementById("question").innerText = "🎉 Fin du quiz";
        document.getElementById("answers").innerHTML = "";
        return;
    }

    load();
}

// 🔥 appliquer langue interface
applyLang();

// 🔥 lancer quiz
load();

</script>

</body>
</html>
