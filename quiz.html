<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Stable</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;}
button{width:80%;padding:10px;margin:5px;border-radius:10px;}
</style>
</head>

<body>

<h2>Quiz</h2>

<div id="score"></div>
<p id="question">Chargement...</p>
<div id="answers"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>

// 🔥 CONFIG



firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔥 QUESTIONS
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"Capitale BF?",a:["Ouaga","Paris","Accra"],c:0}
];

// 🔥 STATE SAUVEGARDÉ
let i = Number(localStorage.getItem("i")) || 0;
let score = Number(localStorage.getItem("score")) || 0;

// 🔥 LOAD
function load(){

if(i>=QUESTIONS.length){end();return;}

document.getElementById("question").innerText=QUESTIONS[i].q;

let html="";
QUESTIONS[i].a.forEach((a,idx)=>{
html+=`<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML=html;
document.getElementById("score").innerText="Score: "+score;

// sauvegarde
localStorage.setItem("i", i);
localStorage.setItem("score", score);
}

// 🔥 CHECK
function check(n){
if(n===QUESTIONS[i].c) score++;
i++;
load();
}

// 🔥 FIN
function end(){

document.getElementById("question").innerText="FIN 🎉";
document.getElementById("answers").innerHTML="";

localStorage.removeItem("i");
localStorage.removeItem("score");

// 🔥 FIREBASE
db.collection("scores").add({
score: score,
date: new Date().toString(),
lang: "fr"
});
}

load();

</script>

</body>
</html>
