<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pro</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}

button{
    width:80%;
    padding:12px;
    margin:8px;
    border:none;
    border-radius:10px;
}

.box{
    padding:10px;
}
</style>
</head>

<body>

<h1>🧠 QUIZ PRO</h1>

<div class="box" id="timer">⏱ 30</div>
<div class="box" id="score">Score: 0</div>

<p id="question"></p>
<div id="answers"></div>

<script>

let lang=localStorage.getItem("lang")||"fr";

let questions=[
{q:{fr:"Capitale Burkina ?",en:"Capital Burkina ?"},a:["Ouaga","Bobo"],c:0},
{q:{fr:"2+2 ?",en:"2+2 ?"},a:["3","4"],c:1},
{q:{fr:"JS est ?",en:"JS is ?"},a:["langage","animal"],c:0},
{q:{fr:"HTML est ?",en:"HTML is ?"},a:["markup","game"],c:0}
];

let i=0;
let score=0;
let time=30;

// TIMER
let t=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="⏱ "+time;

    if(time<=0) end();
},1000);

function load(){
    let q=questions[i].q[lang]||questions[i].q.fr;

    document.getElementById("question").innerText=q;

    let html="";
    questions[i].a.forEach((a,idx)=>{
        html+=`<button onclick="check(${idx})">${a}</button>`;
    });

    document.getElementById("answers").innerHTML=html;
    document.getElementById("score").innerText="Score: "+score;
}

function check(n){
    if(n===questions[i].c) score++;

    i++;
    if(i>=questions.length) return end();

    load();
}

function end(){
    clearInterval(t);

    document.getElementById("question").innerText="🎉 FIN DU QUIZ";
    document.getElementById("answers").innerHTML="";
    document.getElementById("score").innerText="Score final: "+score;

    save();
    send();
}

// classement local
function save(){
    let b=JSON.parse(localStorage.getItem("board")||"[]");
    b.push(score);
    b.sort((a,b)=>b-a);
    localStorage.setItem("board",JSON.stringify(b));
}

// telegram
function send(){
    const token="TON_TOKEN";
    const chat_id="TON_CHAT_ID";

    fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            chat_id,
            text:"🎯 Score: "+score
        })
    });
}

load();

</script>

</body>
</html>
