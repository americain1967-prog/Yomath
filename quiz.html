<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Stable</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;}
button{width:80%;padding:10px;margin:5px;border-radius:10px;}
</style>
</head>

<body>

<h2>Quiz Stable</h2>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<script>

// 🧠 QUESTIONS
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"Capitale BF ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

let i = 0;
let score = 0;

// 🚀 LOAD
function load(){

if(i >= QUESTIONS.length){
document.getElementById("question").innerText = "FIN 🎉";
document.getElementById("answers").innerHTML = "";
return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html = "";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = "Score: " + score;

}

// ✅ CHECK
function check(n){

if(n === QUESTIONS[i].c){
score++;
}

i++;
load();
}

load();

</script>

</body>
</html>
