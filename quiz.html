<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pro Ultimate</title>

<style>
body{
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
    margin: 0;
}

.header{
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
}

.box{
    margin: 10px;
}

button{
    width: 80%;
    padding: 12px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

#timer{
    color: orange;
    font-size: 18px;
}

#question{
    font-size: 18px;
    margin: 20px;
}
</style>
</head>

<body>

<div class="header">🧠 Quiz Ultimate Startup</div>

<div id="timer">⏱ 30</div>
<div class="box" id="score">Score: 0</div>

<p id="question">Loading...</p>
<div id="answers"></div>

<!-- 🔥 MODULES (OBLIGATOIRE) -->
<script src="app.js"></script>
<script src="data.js"></script>
<script src="api.js"></script>

<script>

// =======================
// 🚀 QUIZ ENGINE ULTIME
// =======================

let lang = localStorage.getItem("lang") || "fr";
let i = 0;
let score = 0;
let time = 30;

// 🔥 SECURITE DATA
if (typeof QUESTIONS === "undefined") {
    document.getElementById("question").innerText =
        "❌ QUESTIONS NOT LOADED (check data.js)";
}

// =======================
// ⏱ TIMER
// =======================
let timer = setInterval(() => {
    time--;
    document.getElementById("timer").innerText = "⏱ " + time;

    if (time <= 0) {
        endQuiz();
    }
}, 1000);

// =======================
// 📌 LOAD QUESTION
// =======================
function loadQuestion() {

    if (!QUESTIONS || QUESTIONS.length === 0) {
        document.getElementById("question").innerText = "❌ No questions found";
        return;
    }

    if (i >= QUESTIONS.length) {
        endQuiz();
        return;
    }

    let q = QUESTIONS[i].q[lang] || QUESTIONS[i].q.fr;

    document.getElementById("question").innerText = q;

    let html = "";

    QUESTIONS[i].a.forEach((ans, idx) => {
        html += `<button onclick="check(${idx})">${ans}</button>`;
    });

    document.getElementById("answers").innerHTML = html;
    document.getElementById("score").innerText = "Score: " + score;
}

// =======================
// ✅ CHECK ANSWER
// =======================
function check(n) {

    if (n === QUESTIONS[i].c) {
        score++;
    }

    i++;
    loadQuestion();
}

// =======================
// 🏁 END QUIZ
// =======================
function endQuiz() {

    clearInterval(timer);

    document.getElementById("question").innerText = "🎉 FIN DU QUIZ";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("score").innerText = "Score final: " + score;

    // 💾 SAVE LOCAL RANKING
    if (typeof saveScore === "function") {
        saveScore(score);
    }

    // 📲 TELEGRAM / API
    if (typeof sendToTelegram === "function") {
        sendToTelegram(score);
    }
}

// =======================
// 🚀 START
// =======================
loadQuestion();

</script>

</body>
</html>
