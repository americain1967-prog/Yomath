<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Mondial</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;}
button{width:80%;padding:10px;margin:6px;border-radius:10px;}
input{width:80%;padding:10px;margin:6px;}
</style>
</head>

<body>

<h2>🌍 Quiz Mondial</h2>

<input id="name" placeholder="Ton pseudo">
<button onclick="saveName()">Valider</button>

<div id="score">Score: 0</div>
<p id="question"></p>
<div id="answers"></div>

<hr>

<h3>🏆 Classement</h3>
<div id="ranking">Chargement...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// 🔥 SAFE INIT
let supabase = null;

try {
const supabaseUrl = "https://matxsixoybtakfdmtqki.supabase.co";
const supabaseKey = "";

supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
console.log("Supabase OK");
} catch(e){
console.log("Supabase erreur mais quiz OK");
}

// QUESTIONS
const QUESTIONS = [
{q:"2+2=?",a:["3","4","5"],c:1},
{q:"Capitale BF ?",a:["Ouaga","Paris","Accra"],c:0},
{q:"10/2=?",a:["2","5","10"],c:1}
];

let i = 0;
let score = 0;
let player = "";

// NAME
function saveName(){
player = document.getElementById("name").value;
}

// LOAD
function load(){

if(i >= QUESTIONS.length){
endQuiz();
return;
}

document.getElementById("question").innerText = QUESTIONS[i].q;

let html="";
QUESTIONS[i].a.forEach((a,idx)=>{
html += `<button onclick="check(${idx})">${a}</button>`;
});

document.getElementById("answers").innerHTML = html;
document.getElementById("score").innerText = "Score: "+score;
}

// CHECK
function check(n){
if(n === QUESTIONS[i].c){
score++;
}
i++;
load();
}

// END
async function endQuiz(){

document.getElementById("question").innerText = "FIN 🎉";
document.getElementById("answers").innerHTML = "";

if(supabase){
try{
await supabase.from("ranking").insert([{name:player||"Anonyme",score:score}]);
} catch(e){
console.log("Erreur envoi");
}
}

loadRanking();
}

// RANKING
async function loadRanking(){

if(!supabase){
document.getElementById("ranking").innerText="Pas connecté";
return;
}

try{
let {data} = await supabase.from("ranking").select("*").limit(5);

let html="";
data.forEach(p=>{
html += `<p>${p.name} - ${p.score}</p>`;
});

document.getElementById("ranking").innerHTML = html;
}catch(e){
document.getElementById("ranking").innerText="Erreur";
}
}

// INIT
load();
loadRanking();

</script>

</body>
</html>
