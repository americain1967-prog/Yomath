<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Pro</title>

<style>
body{font-family:Arial;background:#111;color:white;text-align:center}
button{margin:8px;padding:10px;width:80%;border:none;border-radius:10px}
.badge{padding:5px 10px;background:orange;border-radius:10px}
</style>
</head>

<body>

<h1>🧠 QUIZ PRO</h1>

<div class="badge" id="level">Level: Easy</div>
<div id="timer">⏱ 30</div>

<p id="question"></p>
<div id="answers"></div>

<p id="score"></p>

<script>

let lang=localStorage.getItem("lang")||"fr";

/* 🔥 20+ QUESTIONS */
const questions=[
{q:{fr:"Capitale Burkina ?",en:"Capital Burkina ?",es:"Capital Burkina ?",dioula:"...",moore:"..."},a:["Ouaga","Bobo"],c:0},
{q:{fr:"2+2?",en:"2+2?",es:"2+2?"},a:["3","4"],c:1},
{q:{fr:"x² dérivée ?",en:"derivative x²?"},a:["2x","x"],c:0},
{q:{fr:"JavaScript est ?",en:"JS is?"},a:["langage","animal"],c:0}
];

// 🔥 VARIABLES
let i=0;
let score=0;
let time=30;
let level="easy";

// 🔥 TIMER
let t=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="⏱ "+time;

    if(time<=0){
        endQuiz();
    }
},1000);

// 🔥 LOAD QUESTION
function load(){
    let q=questions[i].q[lang]||questions[i].q.fr;

    document.getElementById("question").innerText=q;

    let html="";
    questions[i].a.forEach((a,idx)=>{
        html+=`<button onclick="check(${idx})">${a}</button>`;
    });

    document.getElementById("answers").innerHTML=html;
    document.getElementById("score").innerText="Score: "+score;
}

function check(n){
    if(n===questions[i].c) score++;

    i++;

    if(i>=questions.length){
        endQuiz();
        return;
    }

    load();
}

// 🔥 FIN QUIZ
function endQuiz(){

clearInterval(t);

document.getElementById("question").innerText="🎉 FIN";
document.getElementById("answers").innerHTML="";

saveScore();
sendTelegram();

}

// 🔥 CLASSEMENT LOCAL
function saveScore(){
    let board=JSON.parse(localStorage.getItem("board")||"[]");
    board.push(score);
    board.sort((a,b)=>b-a);
    localStorage.setItem("board",JSON.stringify(board));
}

// 🔥 TELEGRAM
function sendTelegram(){
    const token="TON_TOKEN";
    const chat_id="TON_CHAT_ID";

    fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            chat_id,
            text:"🎯 Score: "+score
        })
    });
}

load();

</script>

</body>
</html>
