<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#111;color:white;text-align:center">

<h1>🏆 Ranking</h1>

<div id="list"></div>

<script>

let b=JSON.parse(localStorage.getItem("board")||"[]");

document.getElementById("list").innerHTML =
b.length ? b.map((s,i)=>`<p>#${i+1} - ${s}</p>`).join("") : "No score";

</script>

</body>
</html>
