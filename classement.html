<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>🏆 Classement</h2>

<div id="r"></div>

<script>

let players=JSON.parse(localStorage.getItem("world")||"[]");

players.push({
name:localStorage.getItem("player"),
score:Math.floor(Math.random()*100)
});

players.sort((a,b)=>b.score-a.score);

localStorage.setItem("world",JSON.stringify(players));

document.getElementById("r").innerHTML=
players.map((p,i)=>`${i+1}. ${p.name} - ${p.score}`).join("<br>");

</script>

</body>
</html>
