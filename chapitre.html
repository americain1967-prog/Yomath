<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  width:80%;
  margin:6px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
}
.card{
  background:#111827;
  margin:10px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📚 Chapitre Hub</h2>

<div class="card">
<p id="info"></p>
</div>

<button onclick="go('cours.html')">📖 Cours</button>
<button onclick="go('quiz.html')">🎮 Quiz</button>
<button onclick="go('devoir.html')">📝 Exos</button>
<button onclick="go('correction.html')">✅ Correction</button>
<button onclick="go('chat.html')">💬 Chat</button>

<hr>

<h3>⚔️ Compétition</h3>

<button onclick="startMatch()">⚔️ Duel élève</button>
<button onclick="showRanking()">🏆 Classement</button>
<button onclick="autoCompetition()">🌍 Compétition auto</button>

<div class="card" id="out"></div>

<script>

let player = localStorage.getItem("player");
let classe = localStorage.getItem("classe");
let matiere = localStorage.getItem("matiere");
let chapitre = localStorage.getItem("chapitre");

document.getElementById("info").innerText =
player+" | "+classe+" | "+matiere+" | "+chapitre;

function go(p){
window.location.href = p;
}

//
// ⚔️ DUEL SIMULÉ (INVITATION FUTURE)
//
function startMatch(){

let enemy = "Joueur_" + Math.floor(Math.random()*100);

let score1 = Math.floor(Math.random()*10);
let score2 = Math.floor(Math.random()*10);

let result = "";

if(score1 > score2){
result = "🏆 Tu as gagné contre " + enemy;
}else if(score1 < score2){
result = "🤖 Tu as perdu contre " + enemy;
}else{
result = "🤝 Égalité avec " + enemy;
}

// sauvegarde score global
let score = Number(localStorage.getItem("score")||0);
localStorage.setItem("score", score + (score1>score2?5:1));

document.getElementById("out").innerText = result;
}

//
// 🏆 CLASSEMENT LOCAL SIMULÉ
//
function showRanking(){

let players = JSON.parse(localStorage.getItem("ranking")||"[]");

players.push({
name: player,
score: Number(localStorage.getItem("score")||0)
});

players.sort((a,b)=>b.score-a.score);

localStorage.setItem("ranking", JSON.stringify(players));

document.getElementById("out").innerHTML =
players.map((p,i)=>`${i+1}. ${p.name} - ${p.score}`).join("<br>");
}

//
// 🌍 COMPÉTITION AUTOMATIQUE
//
function autoCompetition(){

let msg = "🌍 Tournoi lancé...\n";

let result = Math.random();

if(result > 0.5){
msg += "🔥 Tu es qualifié pour le niveau supérieur";
}else{
msg += "❌ Éliminé, entraîne-toi";
}

document.getElementById("out").innerText = msg;
}

</script>

</body>
</html>
