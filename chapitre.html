<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapitre Hub</title>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

button{
  padding:12px;
  width:80%;
  margin:6px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
}

.card{
  background:#111827;
  margin:10px;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📚 Chapitre Hub</h2>

<div class="card">
<p id="info"></p>
</div>

<!-- MENU PRINCIPAL DU CHAPITRE -->
<button onclick="go('cours.html')">📖 Cours</button>
<button onclick="go('quiz.html')">🎮 Quiz</button>
<button onclick="go('devoir.html')">📝 Exercice / Devoir</button>
<button onclick="go('correction.html')">✅ Correction</button>
<button onclick="go('chat.html')">💬 Aide (Chat)</button>

<hr>

<!-- BONUS SYSTEME -->
<button onclick="showScore()">🏆 Voir score</button>
<button onclick="showBadges()">🎖️ Badges</button>
<button onclick="showAI()">🧠 Analyse IA</button>

<div class="card" id="extra"></div>

<script>

// récupération contexte
let player = localStorage.getItem("player");
let classe = localStorage.getItem("classe");
let matiere = localStorage.getItem("matiere");
let chapitre = localStorage.getItem("chapitre");

// affichage info
document.getElementById("info").innerText =
"👤 " + player + " | 📘 " + classe + " | 📚 " + matiere + " | 📌 " + chapitre;

// navigation
function go(page){
window.location.href = page;
}

// score simple
function showScore(){
let score = localStorage.getItem("score") || 0;
document.getElementById("extra").innerText =
"🏆 Score actuel : " + score;
}

// badges simples
function showBadges(){

let score = Number(localStorage.getItem("score") || 0);

let badge = "";

if(score > 20) badge = "🔥 Expert";
else if(score > 10) badge = "⚡ Avancé";
else badge = "🟢 Débutant";

document.getElementById("extra").innerText =
"🎖️ Badge : " + badge;
}

// IA analyse simple
function showAI(){

let msg = "";

if(matiere === "math"){
msg = "🧠 IA : concentre-toi sur les exercices et calculs.";
}

if(matiere === "pc"){
msg = "🧠 IA : révise les formules et expériences.";
}

if(matiere === "svt"){
msg = "🧠 IA : comprends les schémas et processus biologiques.";
}

document.getElementById("extra").innerText = msg;
}

</script>

</body>
</html>
