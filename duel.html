<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>⚔️ Duel Quiz</h2>

<p id="q">2 + 2 = ?</p>

<button onclick="play(3)">3</button>
<button onclick="play(4)">4</button>
<button onclick="play(5)">5</button>

<p id="r"></p>

<script>

function play(n){

let ai = Math.random() > 0.5 ? 4 : 3;

if(n == 4 && ai != 4){
document.getElementById("r").innerText="🏆 Tu gagnes";
}
else if(n == ai){
document.getElementById("r").innerText="🤝 Égalité";
}
else{
document.getElementById("r").innerText="🤖 IA gagne";
}

}

</script>

</body>
</html>
