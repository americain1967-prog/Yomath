<!DOCTYPE html>
<html>
<body style="font-family:Arial;background:#0f172a;color:white;text-align:center">

<h2>⚔️ Duel Code Match</h2>

<input id="code" placeholder="Code match">

<button onclick="create()">Créer</button>
<button onclick="join()">Rejoindre</button>

<p id="out"></p>

<script>

function create(){
let c=Math.floor(Math.random()*9999);
localStorage.setItem("match",c);
document.getElementById("out").innerText="Code: "+c;
}

function join(){
let c=document.getElementById("code").value;
if(c==localStorage.getItem("match")){
document.getElementById("out").innerText="⚔️ Match OK";
}else{
document.getElementById("out").innerText="❌ Code faux";
}
}

</script>

</body>
</html>
