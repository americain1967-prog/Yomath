<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>

const socket = io("http://localhost:3000");

function sendDuel(){
socket.emit("duel", {
player: localStorage.getItem("player"),
score: Math.random()*10
});
}

socket.on("duel",(data)=>{
console.log("Duel update:", data);
});

</script>
